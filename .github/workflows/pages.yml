name: Check and publish Bix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game
        run: |
          node --check dist/game.js
          node --check dist/level2.js
          node --check dist/level3.js
          node --check dist/level3-glove.js
          node --check dist/level3-data.js
          node --check dist/level3-art.js
          node --check dist/level4.js
          node --check dist/level4-core.js
          node --check dist/level4-data.js
          node --check dist/level5.js
          node --check dist/level5-data.js
          node --check dist/level6.js
          node --check dist/level6-data.js
          node --check dist/level6-art.js
          node --check dist/audio.js
          node tests/gameplay.cjs
          node tests/level1-2-fuzz.cjs
          node tests/graphics.cjs
          node tests/level2-engine.cjs
          node tests/level2-enemies.cjs
          node tests/level2-geometry.cjs
          node tests/level2-finish.cjs
          node tests/level2-camera.cjs
          node tests/level2-art-aspect.cjs
          node tests/level2-engine-fixes.cjs
          node tests/level2-route.cjs
          node tests/level2-softlock.cjs
          node tests/level2-art-clean.cjs
          node tests/touch-select.cjs
          node tests/level3-glove.cjs
          node tests/level3-geometry.cjs
          node tests/level3-engine.cjs
          node tests/level3-softlock.cjs
          node tests/level3-route.cjs
          node tests/level3-areas.cjs
          node tests/level3-rules.cjs
          node tests/level3-physics.cjs
          node tests/level4-core.cjs
          node tests/level4-geometry.cjs
          node tests/level4-engine.cjs
          node tests/level5-gates.cjs
          node tests/level5-route.cjs
          node tests/level5-hazards.cjs
          node tests/level6-geometry.cjs
          node tests/level6-engine.cjs
          node tests/audio.cjs
          node tests/landing.cjs
          node tests/progress.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
