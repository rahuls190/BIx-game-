name: Check and publish Bix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game
        run: |
          node --check dist/game.js
          node --check dist/level2.js
          node tests/gameplay.cjs
          node tests/graphics.cjs
          node tests/level2-engine.cjs
          node tests/level2-enemies.cjs
          node tests/level2-geometry.cjs
          node tests/level2-finish.cjs
          node tests/level2-camera.cjs
          node tests/level2-art-aspect.cjs
          node tests/level2-engine-fixes.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
