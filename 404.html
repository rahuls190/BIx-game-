<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Project Mayhem</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071217;color:#edf0dc;font-family:system-ui,sans-serif}a{color:#ffd75a}</style>
</head>
<body>
  <p>Taking you to <a href="/BIx-game-/">Project Mayhem</a>…</p>
  <!--
    Only served if GitHub Pages publishes the repository ROOT instead of the dist/ folder (see index.html and
    .github/workflows/pages.yml). In that case the game pages live under /dist/, so an address like /level2.html is
    forwarded to /dist/level2.html. The counterpart for the normal setup is dist/404.html. A path that is already under
    /dist/ is left alone, so this can never loop.
  -->
  <script>
    (function () {
      var base = location.pathname.indexOf('/BIx-game-/') === 0 || location.pathname === '/BIx-game-' ? '/BIx-game-' : '';
      var rest = location.pathname.slice(base.length) || '/';
      if (/^\/dist(\/|$)/.test(rest)) return;
      location.replace(base + '/dist' + rest + location.search + location.hash);
    })();
  </script>
</body>
</html>
